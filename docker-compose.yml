# Local stack: autopilot + ollama. Both fully local; no API keys required.
#
# Usage:
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen3.5:0.8b
#   docker compose exec ollama ollama pull qwen3.5:4b
#   curl http://localhost:8000/health
services:
  ollama:
    image: ollama/ollama:latest
    container_name: autopilot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  autopilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autopilot-api
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      AUTOPILOT_OLLAMA_BASE_URL: http://ollama:11434
      AUTOPILOT_SQLITE_PATH: /data/autopilot.db
    ports:
      - "8000:8000"
    volumes:
      - autopilot-data:/data
      - hf-cache:/home/autopilot/.cache/huggingface

volumes:
  ollama-data:
  autopilot-data:
  hf-cache:
