name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: build and start the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.14"
      - run: uv build
      - name: Install the wheel in a clean venv
        run: |
          uv venv /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv dist/*.whl
      # Serving needs the [ml] extra (torch, several GB), loaded in the lifespan.
      # Building the ASGI app from the wheel proves the package, its routes and
      # its core dependencies install and import cleanly.
      - name: Build the ASGI app from the installed wheel
        working-directory: /tmp
        run: >-
          /tmp/wheel-venv/bin/python -c
          "from llm_cost_autopilot.main import app;
          paths = set(app.openapi()['paths']);
          assert {'/health', '/v2/route', '/v1/chat/completions'} <= paths, paths;
          print(sorted(paths))"
