[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-cost-autopilot"
version = "0.1.0"
description = "Two-stage zero-shot complexity classifier that routes LLM requests to the cheapest capable model — and gets smarter the more it's used."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Adel Saoud" }]
keywords = ["llm", "routing", "cost-optimization", "zero-shot", "ollama", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "httpx>=0.28",
    "structlog>=25.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.21",
    "tenacity>=9.0",
    # Used by scripts/demo_autopilot.py + scripts/load_test.py for terminal UI.
    "rich>=14.0",
]

[project.optional-dependencies]
ml = [
    # Heavy ML deps — required at runtime, optional so tests stay fast.
    "sentence-transformers>=3.0",
    "transformers>=4.45",
    "torch>=2.4",
    "numpy>=1.26",
]
dashboard = ["streamlit>=1.45", "plotly>=6.0", "pandas>=2.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.11",
    "pyright>=1.1.400",
    "pre-commit>=4.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/adel-saoud/llm-cost-autopilot"
Repository = "https://github.com/adel-saoud/llm-cost-autopilot"
Issues = "https://github.com/adel-saoud/llm-cost-autopilot/issues"

[project.scripts]
autopilot = "llm_cost_autopilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_autopilot"]

# ── Ruff: lint + format ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # bugbear
    "C4",         # comprehensions
    "UP",         # pyupgrade
    "SIM",        # simplify
    "RUF",        # ruff-specific
    "N",          # pep8-naming
    "ANN",        # type annotations
    "S",          # bandit (security)
    "PT",         # pytest style
    "TID",        # tidy imports
    "PL",         # pylint
    "TRY",        # tryceratops
]
ignore = [
    "ANN401",  # allow Any in narrow cases (e.g. HF pipeline outputs)
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR2004", # magic value comparisons — readable in context
    "PLC0415", # local imports — used intentionally for lazy ML imports
    "PLW0108", # unnecessary lambda — pydantic Field default_factory needs callables
    "TRY003",  # long exception messages are fine
    "TRY004",  # ValueError vs TypeError — domain choice
    "TRY301",  # abstract raise to inner func
    "RUF001",  # ambiguous unicode in strings — intentional
    "RUF002",  # ambiguous unicode in docstrings — intentional
    "RUF003",  # ambiguous unicode in comments — intentional
    "S101",    # assert is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PLR2004", "S101", "S105", "S106"]
# Demo / load-test scripts use `random` for synthetic data — not crypto.
"scripts/**/*.py" = ["S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ── Pyright: strict type checking ───────────────────────────────────────────
[tool.pyright]
include = ["src", "tests"]
# Excluded from strict checks:
#   * dashboard/app.py — streamlit/plotly/pandas lack type stubs
#   * classifier/_real_backends.py — wraps the optional ML extras
#     (sentence-transformers, transformers); those imports resolve only when
#     `uv sync --extra ml` has been run, which we never do in CI/tests.
exclude = [
    "src/llm_cost_autopilot/dashboard/app.py",
    "src/llm_cost_autopilot/classifier/_real_backends.py",
    "src/llm_cost_autopilot/verifier/_real_scorer.py",
]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"

# `pytest.approx` is declared with `Unknown` parameter types in pytest's
# stubs, which makes pyright noisy on every test assertion that uses it.
# Silence those reports inside `tests/` only — the production type bar in
# `src/` stays at the global level.
[[tool.pyright.executionEnvironments]]
root = "tests"
# Keep the project root on the import path so `from tests.conftest import ...`
# still resolves under this environment.
extraPaths = ["."]
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=llm_cost_autopilot",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests using mock Ollama (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["src/llm_cost_autopilot"]
branch = true
omit = [
    "src/llm_cost_autopilot/dashboard/*",
    # Optional ML extras — exercised only by demo/load-test scripts, not tests.
    "src/llm_cost_autopilot/classifier/_real_backends.py",
    "src/llm_cost_autopilot/verifier/_real_scorer.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 85
