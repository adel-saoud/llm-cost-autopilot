[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "llm-cost-autopilot"
version = "0.1.0"
description = "Two-stage zero-shot classifier that routes LLM requests to the cheapest capable model, verifies cheap answers in the background and escalates prompts similar to past misroutes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Adel Saoud" }]
keywords = ["llm", "routing", "cost-optimization", "zero-shot", "ollama", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "httpx>=0.28",
    "structlog>=25.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.21",
    "tenacity>=9.0",
    # Correction-memory nearest-neighbour search and the ML backends' vector math.
    "numpy>=1.26",
    # Used by scripts/demo_autopilot.py + scripts/load_test.py for terminal UI.
    "rich>=14.0",
]

[project.optional-dependencies]
ml = [
    # Heavy ML deps: required at runtime, optional so tests stay fast.
    "sentence-transformers>=3.0",
    "transformers>=4.45",
    "torch>=2.4",
]
dashboard = ["streamlit>=1.45", "plotly>=6.0", "pandas>=2.2"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-mock>=3.15",
    "ruff>=0.17.2,<0.18",
    "pyright==1.1.414",
    "pre-commit>=4.7",
    "commitizen>=4.19.3,<4.20",
]

[project.urls]
Homepage = "https://github.com/adel-saoud/llm-cost-autopilot"
Repository = "https://github.com/adel-saoud/llm-cost-autopilot"
Issues = "https://github.com/adel-saoud/llm-cost-autopilot/issues"

# ── Ruff: lint + format ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
# Demo / load-test scripts use `random` for synthetic data: not crypto.
"scripts/**/*.py" = ["S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ── Pyright: strict type checking ───────────────────────────────────────────
[tool.pyright]
include = ["src", "tests"]
# Excluded from strict checks:
#   * dashboard/app.py: streamlit/plotly/pandas lack type stubs
#   * classifier/huggingface_backends.py and verifier/embedding_scorer.py:
#     wrap the optional ML extras (sentence-transformers, transformers); those
#     imports resolve only after `uv sync --extra ml`, which CI never runs.
exclude = [
    "src/llm_cost_autopilot/dashboard/app.py",
    "src/llm_cost_autopilot/classifier/huggingface_backends.py",
    "src/llm_cost_autopilot/verifier/embedding_scorer.py",
]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"

# `pytest.approx` is declared with `Unknown` parameter types in pytest's
# stubs, which makes pyright noisy on every test assertion that uses it.
# Silence those reports inside `tests/` only: the production type bar in
# `src/` stays at the global level.
[[tool.pyright.executionEnvironments]]
root = "tests"
# Keep the project root on the import path so `from tests.conftest import ...`
# still resolves under this environment.
extraPaths = ["."]
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=llm_cost_autopilot",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests using mock Ollama (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["src/llm_cost_autopilot"]
branch = true
omit = [
    "src/llm_cost_autopilot/dashboard/*",
    # Need the [ml] extra: run by the app lifespan and the eval script, not by tests.
    "src/llm_cost_autopilot/classifier/huggingface_backends.py",
    "src/llm_cost_autopilot/verifier/embedding_scorer.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# `cz bump` reads and writes the version in pyproject.toml and uv.lock (the
# "uv" provider), keeps __version__ in step, and writes CHANGELOG.md and the tag.
# major_version_zero keeps breaking changes on the minor number until 1.0.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_files = ["src/llm_cost_autopilot/__init__.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = false
major_version_zero = true
